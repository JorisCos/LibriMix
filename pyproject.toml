[project]
name = "librimix"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.10.3",
    "numpy>=2.3.1",
    "pandas>=2.3.1",
    "pyloudnorm>=0.1.1",
    "pysndfx>=0.3.6",
    "scipy>=1.16.0",
    "soundfile>=0.13.1",
    "tqdm>=4.67.1",
]

[dependency-groups]
dev = [
    "ruff>=0.12.4",
]

[tool.ruff]
exclude = [".venv"]
indent-width = 4
fix = true

[tool.ruff.lint]
select = ["E", "F", "I"]
fixable = ["ALL"]

[tool.ruff.format]
docstring-code-format = true

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
addopts = "-vv --tb=short -s"
